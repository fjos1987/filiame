<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FILIAME - TactiApp</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% -20%, #1a2646 0%, #080d1a 100%);
            --card-glass: rgba(25, 35, 60, 0.65);
            --card-border: rgba(224, 169, 109, 0.25);
            --card-border-glow: rgba(224, 169, 109, 0.4);
            --input-bg: rgba(12, 18, 32, 0.7);
            --accent-gold: #e0a96d;
            --accent-gold-gradient: linear-gradient(135deg, #f0c392 0%, #d4934b 100%);
            --text-white: #f8fafc;
            --text-muted: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --danger-red: #ff5252;
            --danger-gradient: linear-gradient(135deg, #ff6b6b 0%, #c0392b 100%);
            --radius-large: 20px;
            --radius-medium: 12px;
            --shadow-app: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #050811;
            background-image: var(--bg-gradient);
            color: var(--text-white);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTENEDOR TIPO APLICACIÓN MÓVIL */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background: rgba(10, 15, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-app);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 500px) {
            .app-container {
                height: 92vh;
                border-radius: 36px;
                border: 1px solid rgba(255, 255, 255, 0.12);
            }
        }

        /* CABECERA APP */
        .app-header {
            padding: 20px 20px 10px 20px;
            flex-shrink: 0;
            background: linear-gradient(to bottom, rgba(10, 15, 28, 0.95), rgba(10, 15, 28, 0));
        }

        /* LOGOTIPO FILIAME PREMIUM */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(20, 28, 48, 0.6);
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 20px;
            margin: 0 auto;
            width: fit-content;
        }

        .logo-car-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(224, 169, 109, 0.15);
            border: 1px solid rgba(224, 169, 109, 0.3);
            border-radius: 10px;
            padding: 6px;
            color: var(--accent-gold);
        }

        .logo-car-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffffff 30%, #e0a96d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .logo-flag-pill {
            width: 12px;
            height: 9px;
            border-radius: 2px;
            background: linear-gradient(to bottom, #c60b1e 25%, #ffc400 25%, #ffc400 75%, #c60b1e 75%);
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        /* CUERPO PRINCIPAL / PANTALLAS */
        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px 80px 20px;
            scroll-behavior: smooth;
        }

        /* Transiciones de Pantalla */
        .screen {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* PANTALLA PIN */
        .pin-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
        }

        .pin-card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            padding: 30px 25px;
            border-radius: var(--radius-large);
            backdrop-filter: blur(15px);
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .pin-card h2 {
            margin: 0 0 20px 0;
            font-size: 1.2rem;
            color: var(--text-white);
            font-weight: 600;
        }

        .pin-input {
            font-size: 28px;
            padding: 12px;
            text-align: center;
            width: 100%;
            max-width: 200px;
            letter-spacing: 10px;
            border-radius: var(--radius-medium);
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            color: var(--accent-gold);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .pin-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(224, 169, 109, 0.3);
        }

        /* BARRA NAVEGACIÓN INFERIOR (ESTILO APP) */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: rgba(10, 15, 28, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--accent-gold);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* FORMULARIOS Y CAMPOS */
        .form-section {
            background: var(--card-glass);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-large);
            padding: 18px;
            margin-bottom: 15px;
        }

        .label {
            color: var(--accent-gold);
            font-weight: 600;
            margin-top: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .row { display: flex; gap: 10px; }
        .col { flex: 1; }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-medium);
            color: var(--text-white);
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--card-border-glow);
        }

        textarea { height: 90px; resize: vertical; }

        /* BOTONES STYLED */
        .btn-primary {
            width: 100%;
            background: var(--accent-gold-gradient);
            color: #080d1a;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: var(--radius-medium);
            margin-top: 15px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(224, 169, 109, 0.25);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-danger {
            width: 100%;
            background: var(--danger-gradient);
            color: #fff;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: var(--radius-medium);
            margin-top: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.2);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-white);
            border: 1px solid var(--border-subtle);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-backup {
            background: rgba(224, 169, 109, 0.12);
            color: var(--accent-gold);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .btn-backup:hover {
            background: rgba(224, 169, 109, 0.25);
        }

        .backup-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        /* TARJETAS DE ARCHIVO */
        .card {
            background: var(--card-glass);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-medium);
            padding: 14px 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent-gold-gradient);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover, .card:active {
            background: rgba(35, 48, 80, 0.7);
            border-color: var(--card-border);
            transform: translateY(-2px);
        }

        .card:hover::before { opacity: 1; }

        .card-title {
            color: var(--text-white);
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .card-sub {
            font-size: 0.82rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }

        /* FOTO / MULTIMEDIA */
        .photo-input-container { margin-top: 10px; }
        
        .custom-file-upload {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--input-bg);
            border: 1px dashed var(--accent-gold);
            color: var(--accent-gold);
            padding: 12px;
            border-radius: var(--radius-medium);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .photo-preview-wrapper {
            position: relative;
            display: none;
            margin-top: 12px;
            text-align: center;
        }

        #photo-preview {
            max-width: 100%;
            max-height: 220px;
            border-radius: var(--radius-medium);
            border: 1px solid var(--card-border);
        }

        /* DETALLE DE LA NOTA */
        .detail-group {
            background: var(--card-glass);
            padding: 12px 14px;
            border-radius: var(--radius-medium);
            margin-bottom: 8px;
            border: 1px solid var(--border-subtle);
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--accent-gold);
            font-weight: 700;
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 0.95rem;
            color: var(--text-white);
            margin-top: 4px;
            word-break: break-word;
        }

        .detail-img {
            width: 100%;
            border-radius: var(--radius-medium);
            margin-top: 12px;
            border: 1px solid var(--card-border);
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .header-title h2 {
            font-size: 1.2rem;
            margin: 0;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER COMÚN CON LOGO -->
        <div class="app-header">
            <div class="logo-container">
                <div class="logo-car-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4h14v4z"/>
                        <circle cx="7.5" cy="15.5" r="1.5"/>
                        <circle cx="16.5" cy="15.5" r="1.5"/>
                        <path d="M10 2h4v2h-4z"/>
                    </svg>
                </div>
                <span class="logo-text">FILIAME</span>
                <div class="logo-flag-pill"></div>
            </div>
        </div>

        <!-- CUERPO DE LA APP -->
        <div class="app-body">

            <!-- 1. PANTALLA PIN -->
            <div id="screen-pin" class="screen active">
                <div class="pin-wrapper">
                    <div class="pin-card">
                        <h2>🔒 Acceso Restringido</h2>
                        <input type="password" id="pin-input" class="pin-input" maxlength="6" placeholder="******" autocomplete="off">
                        <button class="btn-primary" onclick="checkPin()">Acceder a la App</button>
                    </div>
                </div>
            </div>

            <!-- 2. ARCHIVO / LISTA DE NOTAS -->
            <div id="screen-archive" class="screen">
                <div class="header-title">
                    <h2>📁 Identificaciones</h2>
                    <button class="btn-back" onclick="showScreen('screen-pin')">🔒 Salir</button>
                </div>
                
                <!-- BARRA DE COPIAS DE SEGURIDAD -->
                <div class="backup-bar">
                    <button class="btn-backup" onclick="exportBackup()">📥 Copia de Seguridad</button>
                    <label class="btn-backup">
                        📤 Restaurar Copia
                        <input type="file" id="import-input" accept=".json" style="display:none;" onchange="importBackup(event)">
                    </label>
                </div>

                <input type="text" id="search-bar" placeholder="🔍 Buscar por nombre, DNI, matrícula..." oninput="filterNotes()" style="margin-bottom: 15px;">
                
                <div id="notes-list"></div>
            </div>

            <!-- 3. FORMULARIO DE NUEVA / EDITAR NOTA -->
            <div id="screen-form" class="screen">
                <div class="header-title">
                    <button class="btn-back" onclick="showScreen('screen-archive')">← Volver</button>
                    <h2 id="form-title">Nueva Nota</h2>
                    <div></div>
                </div>

                <form id="note-form" onsubmit="event.preventDefault();">
                    <input type="hidden" id="note-id">

                    <div class="form-section">
                        <div class="label">📍 Lugar de intervención</div>
                        <input type="text" id="lugar" placeholder="Lugar o ubicación exacta">

                        <div class="label">👤 Nombre y apellidos</div>
                        <input type="text" id="nombre" placeholder="Nombre completo" required>

                        <div class="row">
                            <div class="col">
                                <div class="label">🪪 Nº Documento</div>
                                <input type="text" id="documento" placeholder="DNI / NIE / Pasaporte">
                            </div>
                            <div class="col">
                                <div class="label">🌍 Nacimiento</div>
                                <input type="text" id="lugar_nac" placeholder="Lugar">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col">
                                <div class="label">📅 Fecha Nac.</div>
                                <input type="text" id="fecha_nac" placeholder="DD-MM-AAAA">
                            </div>
                            <div class="col">
                                <div class="label">📞 Teléfono</div>
                                <input type="tel" id="telefono" placeholder="Número">
                            </div>
                        </div>

                        <div class="label">👨‍👩‍👦 Nombre de los padres</div>
                        <input type="text" id="padres" placeholder="Padre y Madre">

                        <div class="label">🏠 Domicilio</div>
                        <input type="text" id="domicilio" placeholder="Dirección completa">

                        <div class="row">
                            <div class="col">
                                <div class="label">🚘 Vehículo</div>
                                <input type="text" id="vehiculo" placeholder="Marca/Modelo">
                            </div>
                            <div class="col">
                                <div class="label">🔢 Matrícula</div>
                                <input type="text" id="matricula" placeholder="Matrícula">
                            </div>
                        </div>

                        <!-- ADJUNTAR FOTO -->
                        <div class="label">📷 Fotografía</div>
                        <div class="photo-input-container">
                            <label for="photo-input" class="custom-file-upload">
                                📷 Elegir de Galería / Tomar Foto
                            </label>
                            <input type="file" id="photo-input" accept="image/*" style="display:none;" onchange="previewPhoto(event)">
                            
                            <div id="photo-wrapper" class="photo-preview-wrapper">
                                <img id="photo-preview" src="#" alt="Vista previa">
                                <button type="button" class="btn-danger" onclick="removePhoto()">🗑️ Eliminar foto actual</button>
                            </div>
                        </div>

                        <div class="label">📝 Hechos</div>
                        <textarea id="hechos" placeholder="Detalles de la intervención..."></textarea>
                    </div>

                    <button type="button" class="btn-primary" onclick="saveNote()">Guardar Fila / Registro</button>
                </form>
            </div>

            <!-- 4. DETALLE DE LA NOTA -->
            <div id="screen-detail" class="screen">
                <div class="header-title">
                    <button class="btn-back" onclick="showScreen('screen-archive')">← Volver</button>
                    <h2>Detalle</h2>
                    <div></div>
                </div>

                <div id="detail-content"></div>

                <button class="btn-primary" onclick="editCurrentNote()">✏️ Editar Registro</button>
                <button class="btn-danger" onclick="deleteCurrentNote()">🗑️ Eliminar Registro</button>
            </div>

        </div>

        <!-- BOTTOM NAVBAR NAVEGACIÓN -->
        <div id="bottom-nav" class="bottom-nav" style="display: none;">
            <button class="nav-item active" onclick="showScreen('screen-archive')">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/></svg>
                <span>Registros</span>
            </button>
            <button class="nav-item" onclick="openNewNote()">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <span>Añadir</span>
            </button>
        </div>

    </div>

    <script>
        const PIN_CORRECTO = "130037";
        let notes = JSON.parse(localStorage.getItem('id_notes')) || [];
        let currentBase64Image = "";
        let currentNoteId = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            const nav = document.getElementById('bottom-nav');
            if (id === 'screen-pin') {
                nav.style.display = 'none';
            } else {
                nav.style.display = 'flex';
            }

            if (id === 'screen-archive') renderNotes(notes);
        }

        function checkPin() {
            const input = document.getElementById('pin-input').value;
            if (input === PIN_CORRECTO) {
                document.getElementById('pin-input').value = '';
                showScreen('screen-archive');
            } else {
                alert("PIN Incorrecto");
            }
        }

        function previewPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentBase64Image = e.target.result;
                    const preview = document.getElementById('photo-preview');
                    preview.src = currentBase64Image;
                    document.getElementById('photo-wrapper').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function removePhoto() {
            currentBase64Image = "";
            document.getElementById('photo-input').value = "";
            document.getElementById('photo-preview').src = "#";
            document.getElementById('photo-wrapper').style.display = 'none';
        }

        function openNewNote() {
            currentNoteId = null;
            document.getElementById('note-id').value = '';
            document.getElementById('note-form').reset();
            removePhoto();
            document.getElementById('form-title').innerText = 'Nueva Nota';
            showScreen('screen-form');
        }

        function saveNote() {
            const id = document.getElementById('note-id').value;
            const nombre = document.getElementById('nombre').value;

            if(!nombre) {
                alert("El nombre es obligatorio");
                return;
            }

            if (id) {
                const index = notes.findIndex(n => n.id == id);
                if (index !== -1) {
                    notes[index] = {
                        ...notes[index],
                        lugar: document.getElementById('lugar').value,
                        nombre: nombre,
                        documento: document.getElementById('documento').value,
                        lugar_nac: document.getElementById('lugar_nac').value,
                        fecha_nac: document.getElementById('fecha_nac').value,
                        telefono: document.getElementById('telefono').value,
                        padres: document.getElementById('padres').value,
                        domicilio: document.getElementById('domicilio').value,
                        vehiculo: document.getElementById('vehiculo').value,
                        matricula: document.getElementById('matricula').value,
                        foto: currentBase64Image,
                        hechos: document.getElementById('hechos').value
                    };
                }
            } else {
                const newNote = {
                    id: Date.now(),
                    fecha: new Date().toLocaleString(),
                    lugar: document.getElementById('lugar').value,
                    nombre: nombre,
                    documento: document.getElementById('documento').value,
                    lugar_nac: document.getElementById('lugar_nac').value,
                    fecha_nac: document.getElementById('fecha_nac').value,
                    telefono: document.getElementById('telefono').value,
                    padres: document.getElementById('padres').value,
                    domicilio: document.getElementById('domicilio').value,
                    vehiculo: document.getElementById('vehiculo').value,
                    matricula: document.getElementById('matricula').value,
                    foto: currentBase64Image,
                    hechos: document.getElementById('hechos').value
                };
                notes.unshift(newNote);
            }

            try {
                localStorage.setItem('id_notes', JSON.stringify(notes));
            } catch (e) {
                alert("La memoria del navegador está llena. Guarde sin foto o borre notas antiguas.");
                return;
            }

            showScreen('screen-archive');
        }

        function renderNotes(data) {
            const container = document.getElementById('notes-list');
            container.innerHTML = '';
            
            if (data.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:40px;">No hay identificaciones guardadas.</p>';
                return;
            }

            data.forEach(note => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openNoteDetail(note.id);
                card.innerHTML = `
                    <div class="card-title">${note.nombre || 'Sin nombre'}</div>
                    <div class="card-sub">🪪 Doc: ${note.documento || 'N/A'} | 🚘 Mat: ${note.matricula || 'N/A'}</div>
                    <div class="card-sub">📍 ${note.lugar || 'Ubicación no especificada'}</div>
                `;
                container.appendChild(card);
            });
        }

        function openNoteDetail(id) {
            currentNoteId = id;
            const note = notes.find(n => n.id == id);
            if (!note) return;

            const container = document.getElementById('detail-content');
            container.innerHTML = `
                <div class="detail-group"><div class="detail-label">👤 Nombre</div><div class="detail-value">${note.nombre || '-'}</div></div>
                <div class="detail-group"><div class="detail-label">🪪 Documento</div><div class="detail-value">${note.documento || '-'}</div></div>
                <div class="detail-group"><div class="detail-label">📍 Ubicación</div><div class="detail-value">${note.lugar || '-'} (${note.fecha})</div></div>
                <div class="detail-group"><div class="detail-label">🌍 Nacimiento</div><div class="detail-value">${note.lugar_nac || '-'}</div></div>
                <div class="detail-group"><div class="detail-label">📅 Fecha Nacimiento</div><div class="detail-value">${note.fecha_nac || '-'}</div></div>
                <div class="detail-group"><div class="detail-label">📞 Teléfono</div><div class="detail-value">${note.telefono || '-'}</div></div>
                <div class="detail-group"><div class="detail-label">👨‍👩‍👦 Padres</div><div class="detail-value">${note.padres || '-'}</div></div>
                <div class="detail-group"><div class="detail-label">🏠 Domicilio</div><div class="detail-value">${note.domicilio || '-'}</div></div>
                <div class="detail-group"><div class="detail-label">🚘 Vehículo / Matrícula</div><div class="detail-value">${note.vehiculo || '-'} / ${note.matricula || '-'}</div></div>
                <div class="detail-group"><div class="detail-label">📝 Hechos</div><div class="detail-value">${note.hechos || '-'}</div></div>
                ${note.foto ? `<img src="${note.foto}" class="detail-img">` : ''}
            `;

            showScreen('screen-detail');
        }

        function editCurrentNote() {
            const note = notes.find(n => n.id == currentNoteId);
            if (!note) return;

            document.getElementById('note-id').value = note.id;
            document.getElementById('lugar').value = note.lugar || '';
            document.getElementById('nombre').value = note.nombre || '';
            document.getElementById('documento').value = note.documento || '';
            document.getElementById('lugar_nac').value = note.lugar_nac || '';
            document.getElementById('fecha_nac').value = note.fecha_nac || '';
            document.getElementById('telefono').value = note.telefono || '';
            document.getElementById('padres').value = note.padres || '';
            document.getElementById('domicilio').value = note.domicilio || '';
            document.getElementById('vehiculo').value = note.vehiculo || '';
            document.getElementById('matricula').value = note.matricula || '';
            document.getElementById('hechos').value = note.hechos || '';

            currentBase64Image = note.foto || '';
            const preview = document.getElementById('photo-preview');
            const wrapper = document.getElementById('photo-wrapper');
            
            if (note.foto) {
                preview.src = note.foto;
                wrapper.style.display = 'block';
            } else {
                removePhoto();
            }

            document.getElementById('form-title').innerText = 'Editar Nota';
            showScreen('screen-form');
        }

        function deleteCurrentNote() {
            if (confirm("¿Seguro que deseas eliminar esta identificación?")) {
                notes = notes.filter(n => n.id != currentNoteId);
                localStorage.setItem('id_notes', JSON.stringify(notes));
                showScreen('screen-archive');
            }
        }

        function filterNotes() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = notes.filter(n => 
                (n.nombre && n.nombre.toLowerCase().includes(query)) ||
                (n.documento && n.documento.toLowerCase().includes(query)) ||
                (n.matricula && n.matricula.toLowerCase().includes(query)) ||
                (n.lugar && n.lugar.toLowerCase().includes(query))
            );
            renderNotes(filtered);
        }

        /* FUNCIONES DE COPIA DE SEGURIDAD */
        function exportBackup() {
            if (notes.length === 0) {
                alert("No hay registros guardados para exportar.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes));
            const downloadAnchor = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `copia_filiame_${dateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedNotes = JSON.parse(e.target.result);
                    if (Array.isArray(importedNotes)) {
                        if (confirm(`Se han encontrado ${importedNotes.length} registros. ¿Deseas reemplazar las notas actuales por las de la copia?`)) {
                            notes = importedNotes;
                            localStorage.setItem('id_notes', JSON.stringify(notes));
                            renderNotes(notes);
                            alert("✅ Copia de seguridad restaurada correctamente.");
                        }
                    } else {
                        alert("El archivo seleccionado no tiene un formato válido de FILIAME.");
                    }
                } catch (err) {
                    alert("Error al leer el archivo de copia de seguridad.");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
